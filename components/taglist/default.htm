{% set tags = __SELF__.tags %}

{% if tags is not empty %}
    <div class="blog-tag-list d-flex flex-wrap gap-1">
        {% for tag in tags %}
            {% set label %}
                {{ tag.name }}
                {% if __SELF__.property('showPostCount') %}
                    <span class="badge text-bg-secondary">{{ tag.posts_count }}</span>
                {% endif %}
            {% endset %}
            {% if tag.url %}
                <a href="{{ tag.url }}" class="btn btn-outline-secondary btn-sm">{{ label }}</a>
            {% else %}
                <span class="btn btn-outline-secondary btn-sm disabled">{{ label }}</span>
            {% endif %}
        {% endfor %}
    </div>
{% endif %}
