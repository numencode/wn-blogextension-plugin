{% set tags = __SELF__.tags %}

{% if tags is not empty %}
    <div class="blog-post-tags d-flex flex-wrap gap-1">
        {% for tag in tags %}
            {% if tag.url %}
                <a href="{{ tag.url }}" class="btn btn-outline-secondary btn-sm">{{ tag.name }}</a>
            {% else %}
                <span class="badge text-bg-secondary">{{ tag.name }}</span>
            {% endif %}
        {% endfor %}
    </div>
{% endif %}
